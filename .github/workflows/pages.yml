# Publica web/ en GitHub Pages al fusionar en main y prueba lo publicado.
#
# Mientras web/ no tenga index.html no publica nada: el trabajo sale en verde
# y lo dice en el resumen. Después de publicar pasa herramientas/prueba-web.py
# sobre la dirección publicada, en todas las páginas index.html de web/.
# Si la prueba falla, la web ya está publicada: el rojo avisa para arreglarla
# en el siguiente PR.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'herramientas/prueba-web.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      hay_web: ${{ steps.mira.outputs.hay_web }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay web que publicar?
        id: mira
        shell: bash
        run: |
          if [ -f web/index.html ]; then
            echo "hay_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_web=false" >> "$GITHUB_OUTPUT"
            echo "web/ todavía no tiene index.html: no se publica nada." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        if: steps.mira.outputs.hay_web == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.mira.outputs.hay_web == 'true'
        with:
          path: web

  publicar:
    needs: preparar
    if: needs.preparar.outputs.hay_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    outputs:
      page_url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  probar:
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright y axe-core
        shell: bash
        run: |
          set -euo pipefail
          pip install playwright
          python -m playwright install --with-deps webkit chromium
          npm i --no-save axe-core@4

      - name: Probar lo publicado
        shell: bash
        env:
          DIRECCION: ${{ needs.publicar.outputs.page_url }}
        run: |
          set -euo pipefail
          mapfile -t paginas < <(cd web && find . -name index.html | sed -e 's|^\.||' -e 's|index\.html$||' | sort)
          echo "Páginas: ${paginas[*]}"
          python herramientas/prueba-web.py --url "$DIRECCION" --paginas "${paginas[@]}" \
            --axe node_modules/axe-core/axe.min.js --capturas capturas-prueba

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-prueba
          path: capturas-prueba
          if-no-files-found: ignore
