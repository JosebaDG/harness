# Revisa que nada de lo que entra en un repo público deba quedarse fuera.
#
# Se ejecuta en este repo (pull_request y push) y también se puede llamar
# como workflow reutilizable (workflow_call) desde otro repo público.
#
# Reglas universales (bloquean siempre, en cualquier repo):
# - tokens de GitHub (clásicos y de grano fino) y client_id de GitHub Apps;
# - rutas de máquina (carpetas de usuario de Linux o de macOS);
# - números de hilo interno («hilo» seguido de almohadilla y número).
#
# Reglas de este proyecto (solo cuando el dueño del repo es JosebaDG):
# el nombre del repo privado del equipo bloquea; el nombre de la persona y el
# del proyecto privado avisan sin fallar. Ya estaban a la vista en el
# historial, así que sacarlas a secretos no ocultaría nada y dejaría la
# revisión sin ellas en los PR que llegan desde un fork.
#
# Reglas extra por repo (opcionales, para quien reutiliza esta Action):
# secretos del repo en Settings > Secrets and variables > Actions, una regla
# por línea, con formato «Etiqueta::patrón_ERE» o solo «patrón_ERE»:
# - LO_PUBLICO_BLOQUEO: bloquea en contenido, diffs y mensajes de commit.
# - LO_PUBLICO_AVISO: avisa sin bloquear (revisión a mano).
# - LO_PUBLICO_BLOQUEO_NOMBRES: bloquea en nombres de archivo.
# GitHub no pasa secretos a un PR que llega desde un fork: entonces estas
# reglas no corren y la Action lo avisa. Las universales y las del proyecto
# corren siempre.
#
# Mira dos cosas:
# - el árbol final, siempre;
# - en un PR, además, las líneas añadidas, nombres nuevos y mensajes de cada
#   commit de la rama. En main mira el árbol y los commits recién llegados
#   (de github.event.before a GITHUB_SHA), mensajes de squash incluidos.
#
# Los patrones integrados usan clases de caracteres (por ejemplo [o]) para que
# este archivo no se detecte a sí mismo. Nunca imprime lo encontrado ni los
# patrones privados: solo el archivo o commit, la línea y la etiqueta.

name: Lo público

on:
  pull_request:
  push:
    branches: [main, 'prueba/**']
  workflow_call:
    inputs:
      revisar_log_sin_horas:
        description: 'Comprueba que log.md no lleve marcas de hora (útil para Wiki)'
        type: boolean
        required: false
        default: false
    secrets:
      LO_PUBLICO_BLOQUEO:
        description: 'Patrones privados que bloquean en contenido/commits (uno por línea)'
        required: false
      LO_PUBLICO_AVISO:
        description: 'Patrones privados que avisan sin bloquear (uno por línea)'
        required: false
      LO_PUBLICO_BLOQUEO_NOMBRES:
        description: 'Patrones privados que bloquean en nombres de archivo (uno por línea)'
        required: false

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar lo que no puede ser público
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          RAMA_BASE: ${{ github.base_ref }}
          CABEZA_PR: ${{ github.event.pull_request.head.sha }}
          RAMA: ${{ github.ref_name }}
          ANTES: ${{ github.event.before }}
          REPO_PR: ${{ github.event.pull_request.head.repo.full_name }}
          REGLAS_BLOQUEO: ${{ secrets.LO_PUBLICO_BLOQUEO }}
          REGLAS_AVISO: ${{ secrets.LO_PUBLICO_AVISO }}
          REGLAS_NOMBRES: ${{ secrets.LO_PUBLICO_BLOQUEO_NOMBRES }}
        run: |
          set -u
          fallos=0
          avisos=0
          reglas_privadas=0
          trabajo=$(mktemp -d)
          trap 'rm -rf "$trabajo"' EXIT
          contenido="$trabajo/contenido.txt"
          donde="$trabajo/donde.txt"
          nombres_commit="$trabajo/nombres_commit.txt"
          donde_nombres="$trabajo/donde_nombres.txt"
          : > "$contenido"
          : > "$donde"
          : > "$nombres_commit"
          : > "$donde_nombres"

          # Qué commits se miran uno a uno, además del árbol final.
          rango=""
          if [ "$EVENTO" = pull_request ]; then
            rango="origin/$RAMA_BASE..$CABEZA_PR"
          elif [ "$EVENTO" = push ] && [ "$RAMA" != main ]; then
            rango="origin/main..$GITHUB_SHA"
          elif [ "$EVENTO" = push ]; then
            if [ -n "${ANTES:-}" ] && ! [[ "$ANTES" =~ ^0+$ ]] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
              rango="$ANTES..$GITHUB_SHA"
            else
              echo "::warning::No encuentro el commit anterior del push: solo reviso el árbol, no los mensajes de lo que entra."
            fi
          fi

          # Líneas añadidas, mensajes y nombres de archivos nuevos de cada commit.
          ncommits=0
          if [ -n "$rango" ]; then
            if ! commits=$(git rev-list --reverse "$rango"); then
              echo "::error::No pude listar los commits de $rango"
              exit 1
            fi
            for sha in $commits; do
              corto=${sha:0:7}
              ncommits=$((ncommits + 1))
              git log -1 --format=%B "$sha" | awk -v c="$corto" -v t="$contenido" -v d="$donde" \
                '{ print >> t; print "commit " c " · mensaje, línea " NR >> d }'
              git -c core.quotePath=false show --format= --no-color --no-ext-diff --no-renames \
                  --diff-merges=first-parent -U0 "$sha" | awk -v c="$corto" -v t="$contenido" -v d="$donde" '
                /^diff --git / { cab = 1; next }
                cab && /^\+\+\+ / { f = substr($0, 5); sub(/^b\//, "", f); next }
                /^@@ / { cab = 0; split($3, a, ","); n = substr(a[1], 2) + 0; next }
                cab { next }
                /^\+/ { print substr($0, 2) >> t; print "commit " c " · " f ":" n >> d; n++ }
              '
              git -c core.quotePath=false show --format= --no-renames --diff-filter=A --name-only "$sha" \
                | awk -v c="$corto" -v t="$nombres_commit" -v d="$donde_nombres" \
                  'NF { print >> t; print "commit " c " · nombre de archivo nuevo" >> d }'
            done
          fi

          anota() { # $1 = nivel, $2 = archivo y línea (o vacío), $3 = dónde, $4 = descripción
            if [ -n "$2" ]; then echo "::$1 $2::$4"; else echo "::$1::$3 · $4"; fi
            echo "- $1 · $3 · $4" >> "$GITHUB_STEP_SUMMARY"
            if [ "$1" = error ]; then fallos=$((fallos + 1)); else avisos=$((avisos + 1)); fi
          }

          # $1 = error | warning, $2 = descripción, $3 = patrón ERE, $4... = opciones (-i, -w)
          revisa() {
            local nivel=$1 desc=$2 patron=$3
            shift 3
            local salida rc linea archivo resto num

            rc=0
            salida=$(git grep -n -I -E "$@" -e "$patron" -- .) || rc=$?
            if [ $rc -gt 1 ]; then
              echo "::error::git grep no pudo revisar: $desc"
              fallos=$((fallos + 1))
            elif [ $rc -eq 0 ]; then
              while IFS= read -r linea; do
                archivo=${linea%%:*}
                resto=${linea#*:}
                num=${resto%%:*}
                anota "$nivel" "file=$archivo,line=$num" "árbol · \`$archivo:$num\`" "$desc"
              done <<< "$salida"
            fi

            [ -s "$contenido" ] || return 0
            rc=0
            salida=$(grep -n -a -E "$@" -e "$patron" "$contenido") || rc=$?
            if [ $rc -gt 1 ]; then
              echo "::error::grep no pudo revisar los commits: $desc"
              fallos=$((fallos + 1))
            elif [ $rc -eq 0 ]; then
              while IFS= read -r linea; do
                num=${linea%%:*}
                anota "$nivel" "" "$(sed -n "${num}p" "$donde")" "$desc"
              done <<< "$salida"
            fi
          }

          # $1 = descripción, $2 = patrón ERE, $3... = opciones: busca en nombres de archivo.
          revisa_nombres() {
            local desc=$1 patron=$2
            shift 2
            local salida rc archivo num

            rc=0
            salida=$(git -c core.quotePath=false ls-files | grep -E "$@" -e "$patron") || rc=$?
            if [ $rc -gt 1 ]; then
              echo "::error::No pude revisar los nombres de archivo: $desc"
              fallos=$((fallos + 1))
            elif [ $rc -eq 0 ]; then
              while IFS= read -r archivo; do
                anota error "" "árbol · nombre de archivo \`$archivo\`" "$desc"
              done <<< "$salida"
            fi

            [ -s "$nombres_commit" ] || return 0
            rc=0
            salida=$(grep -n -a -E "$@" -e "$patron" "$nombres_commit") || rc=$?
            if [ $rc -gt 1 ]; then
              echo "::error::No pude revisar los nombres de archivo en commits: $desc"
              fallos=$((fallos + 1))
            elif [ $rc -eq 0 ]; then
              while IFS= read -r linea; do
                num=${linea%%:*}
                anota error "" "$(sed -n "${num}p" "$donde_nombres")" "$desc"
              done <<< "$salida"
            fi
          }

          # Aplica una lista de reglas recibida desde secreto (una por línea: Etiqueta::patron o patron).
          aplica_lista() {
            local modo=$1 lista=$2 defecto=$3
            local linea desc patron
            [ -n "$lista" ] || return 0
            while IFS= read -r linea || [ -n "$linea" ]; do
              linea=${linea%$'\r'}
              [[ -z "${linea// /}" || "$linea" == \#* ]] && continue
              if [[ "$linea" == *"::"* ]]; then
                desc=${linea%%::*}
                patron=${linea#*::}
              else
                desc=$defecto
                patron=$linea
              fi
              [ -n "$patron" ] || continue
              reglas_privadas=$((reglas_privadas + 1))
              if [ "$modo" = nombres ]; then
                revisa_nombres "$desc" "$patron" -i
              else
                revisa "$modo" "$desc" "$patron" -i
              fi
            done <<< "$lista"
          }

          echo "### Lo público" >> "$GITHUB_STEP_SUMMARY"

          # Reglas universales (bloquean siempre)
          revisa error "Token clásico de GitHub (gh*_)" 'gh[pousr][_][A-Za-z0-9]{36}'
          revisa error "Token de grano fino de GitHub" 'github[_]pat[_][A-Za-z0-9_]{22,}'
          revisa error "client_id de una GitHub App" '(Iv2[3]li[A-Za-z0-9]{4,}|Iv1[.][a-f0-9]{16})'
          revisa error "Ruta de una máquina" '/(ho[m]e|User[s])/[A-Za-z0-9._-]+'
          revisa error "Número de hilo interno" 'hil[o][[:space:]]*#[0-9]+' -i

          # Reglas de este proyecto: solo en los repos de su dueño.
          if [ "${GITHUB_REPOSITORY_OWNER:-}" = "JosebaDG" ]; then
            revisa error "Mención al repo privado del equipo" 'equip[o][-_ ]agentes' -i
            revisa warning "Nombre de persona: revisar si debe ser público" 'Jose[b]a' -w
            revisa warning "Nombre de proyecto privado: revisar si debe ser público" 'Curso[C]oach' -i
          fi

          # Un PR desde un fork no recibe secretos: las reglas extra no corren.
          if [ "$EVENTO" = pull_request ] && [ -n "${REPO_PR:-}" ] && [ "$REPO_PR" != "$GITHUB_REPOSITORY" ]; then
            echo "::warning::PR desde un fork: GitHub no pasa secretos, así que las reglas extra (LO_PUBLICO_*) no corren. Las universales y las del proyecto sí."
            echo "- warning · PR desde un fork: reglas extra sin correr" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Reglas extra configuradas por secreto del repo (opcionales)
          aplica_lista error "${REGLAS_BLOQUEO:-}" "Término restringido (LO_PUBLICO_BLOQUEO)"
          aplica_lista warning "${REGLAS_AVISO:-}" "Término a revisar a mano (LO_PUBLICO_AVISO)"
          aplica_lista nombres "${REGLAS_NOMBRES:-}" "Nombre de archivo restringido (LO_PUBLICO_BLOQUEO_NOMBRES)"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commits revisados uno a uno: $ncommits · Reglas extra activas: $reglas_privadas · Bloqueos: $fallos · Avisos: $avisos" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$fallos" -gt 0 ]; then
            echo "::error::Hay $fallos líneas que no pueden ser públicas. Quítalas antes de fusionar. Si alguna estuvo en un commit, borrarla no basta: avisa y rota el secreto."
            exit 1
          fi

      - name: log.md sin horas
        if: ${{ inputs.revisar_log_sin_horas }}
        shell: bash
        run: |
          if [ -f log.md ] && grep -nE '(^|[^0-9])([01][0-9]|2[0-3])[:h][0-5][0-9]([^0-9]|$)' log.md > /tmp/horas.txt; then
            while IFS=: read -r num _; do
              echo "::error file=log.md,line=$num::log.md lleva una hora; solo fecha y operación"
            done < /tmp/horas.txt
            exit 1
          fi
          echo "log.md sin horas"
